name: Update IPTV link

on:
  schedule:
    - cron: "37 8 */5 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update config.json
        run: python update_config.py

      - name: Show updated config
        run: cat config.json
